# Kavach uptime alarm (Cloudflare Worker, outside Google). Deploy: see README.md.
name = "kavach-uptime"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false   # runs on its cron only; no public URL (status: npx wrangler kv key get last --binding STATE --remote)

[triggers]
crons = ["*/5 * * * *", "30 3 * * 1"]   # every 5 minutes; Monday 09:00 IST weekly check-in

[vars]
ALERT_TO = "kritarth@kavach.care"
ALERT_FROM = "Kavach monitor <alerts@emails.kavach.care>"
DASHBOARD_URL = "https://app.kavach.care"
BACKEND_URL = "https://kavach-backend-303943038694.asia-south1.run.app"
ENGINE_URL = "https://kawach-ai-engine-303943038694.asia-south1.run.app"

# created on first deploy with: npx wrangler kv namespace create STATE  (then paste the id here)
[[kv_namespaces]]
binding = "STATE"
id = "675de38b5c7e47269fdbe94da7bc6b28"
