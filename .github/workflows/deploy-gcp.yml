name: Deploy backend to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-gcp
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: kavach-care
  GCP_REGION: asia-south1
  ARTIFACT_REPO: kavach
  SERVICE: kavach-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, push, and deploy
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE }}
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --build-arg GIT_COMMIT_SHA="${{ github.sha }}" \
            --build-arg GIT_BRANCH="${{ github.ref_name }}" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --build-arg IMAGE_TAG="${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          # --update-env-vars merges; does not wipe secrets (ELEVENLABS, Meta tokens, etc.).
          # Browser automation: 4Gi / 2 CPU / concurrency=1; Chromium is in the image.
          gcloud run deploy ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --image="$IMAGE:${{ github.sha }}" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --port=5000 \
            --memory=4Gi \
            --cpu=2 \
            --concurrency=1 \
            --timeout=300 \
            --min-instances=1 \
            --max-instances=3 \
            --update-env-vars="WHATSAPP_PROVIDER=meta,KAVACH_WHATSAPP_NUMBER=+919203497046,WHATSAPP_META_PHONE_NUMBER_ID=1307628429102389,WHATSAPP_META_WABA_ID=1718021715926380,WHATSAPP_META_APP_ID=2105228567034032,WHATSAPP_META_WEBHOOK_VERIFY_TOKEN=kavach_wa_verify_k9X2mP7nQ4vL8sR3,WHATSAPP_META_GRAPH_VERSION=v22.0,BROWSER_WORKER_MODE=auto,BROWSER_TASK_DEADLINE_MS=75000,BROWSER_PHARMACY_LOGIN=on,COMMERCE_BROWSER_FIRST=1" \
            --quiet

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.url)')"
          BODY="$(curl -fsS "$URL/api/health")"
          echo "$BODY" | grep -q '"status":"ok"'
          echo "$BODY" | grep -q '"browserWorker"'
          echo "$BODY" | grep -Eq '"modeEnv":"(auto|playwright)"'
          echo "Health OK; browserWorker.modeEnv is auto|playwright"
          echo "$BODY"
