name: Update WhatsApp Meta IDs on Cloud Run

on:
  workflow_dispatch:
    inputs:
      waba_id:
        description: WHATSAPP_META_WABA_ID
        required: true
        type: string
        default: "1718021715926380"
      phone_number_id:
        description: WHATSAPP_META_PHONE_NUMBER_ID
        required: true
        type: string
        default: "1307628429102389"

concurrency:
  group: update-whatsapp-meta-ids
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: kavach-care
  GCP_REGION: asia-south1
  SERVICE: kavach-backend
  BACKEND_URL: https://kavach-backend-303943038694.asia-south1.run.app
  WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_META_WEBHOOK_VERIFY_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Update Cloud Run WhatsApp Meta IDs
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --update-env-vars="WHATSAPP_META_WABA_ID=${{ inputs.waba_id }},WHATSAPP_META_PHONE_NUMBER_ID=${{ inputs.phone_number_id }}" \
            --quiet

      - name: Run Meta webhook setup
        run: |
          curl -sS -X POST "${{ env.BACKEND_URL }}/api/webhooks/whatsapp/meta/setup?verify_token=${{ env.WEBHOOK_VERIFY_TOKEN }}" | python3 -m json.tool

      - name: Verify WABA owns phone number
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format=json > /tmp/service.json
          TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_ACCESS_TOKEN'), ''))")
          PHONE_ID=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_PHONE_NUMBER_ID'), ''))")
          WABA_ID=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_WABA_ID'), ''))")
          echo "PHONE_ID=$PHONE_ID WABA_ID=$WABA_ID"
          curl -sS "https://graph.facebook.com/v21.0/${PHONE_ID}?fields=display_phone_number,verified_name,status,webhook_configuration&access_token=${TOKEN}" | python3 -m json.tool
          echo "--- WABA phone_numbers ---"
          curl -sS "https://graph.facebook.com/v21.0/${WABA_ID}/phone_numbers?fields=id,display_phone_number,verified_name&access_token=${TOKEN}" | python3 -m json.tool
