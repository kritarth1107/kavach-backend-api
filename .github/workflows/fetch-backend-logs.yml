name: Diagnose WhatsApp Meta setup

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: kavach-care
  GCP_REGION: asia-south1
  SERVICE: kavach-backend
  BACKEND_URL: https://kavach-backend-303943038694.asia-south1.run.app

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Cloud Run WhatsApp env check
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --format=json > /tmp/service.json
          python3 <<'PY'
          import json
          data = json.load(open("/tmp/service.json"))
          env = {e["name"]: e.get("value", "[secret]") for e in data["spec"]["template"]["spec"]["containers"][0].get("env", [])}
          keys = [
              "WHATSAPP_PROVIDER",
              "KAVACH_WHATSAPP_NUMBER",
              "WHATSAPP_META_PHONE_NUMBER_ID",
              "WHATSAPP_META_WABA_ID",
              "WHATSAPP_META_APP_ID",
              "WHATSAPP_META_GRAPH_VERSION",
              "WHATSAPP_META_WEBHOOK_VERIFY_TOKEN",
              "WHATSAPP_META_APP_SECRET",
              "WHATSAPP_META_ACCESS_TOKEN",
          ]
          for k in keys:
              v = env.get(k, "MISSING")
              if k in ("WHATSAPP_META_APP_SECRET", "WHATSAPP_META_ACCESS_TOKEN"):
                  print(f"{k}: {'SET' if v not in ('MISSING', '', '[secret]') else 'MISSING'} (len={len(v) if v not in ('MISSING', '[secret]') else 0})")
              else:
                  print(f"{k}: {v}")
          PY

      - name: Validate Meta access token against Graph API
        run: |
          TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_ACCESS_TOKEN'), ''))")
          PHONE_ID=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_PHONE_NUMBER_ID'), ''))")
          WABA_ID=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_WABA_ID'), ''))")
          if [ -z "$TOKEN" ] || [ -z "$PHONE_ID" ]; then
            echo "ERROR: Missing token or phone number id on Cloud Run"
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/graph.json -w "%{http_code}" "https://graph.facebook.com/v21.0/${PHONE_ID}?fields=display_phone_number,verified_name,quality_rating,status,platform_type,webhook_configuration&access_token=${TOKEN}")
          echo "Graph API phone lookup HTTP: $HTTP"
          cat /tmp/graph.json
          if [ "$HTTP" != "200" ]; then exit 1; fi
          echo "--- WABA phone_numbers list ---"
          curl -sS "https://graph.facebook.com/v21.0/${WABA_ID}/phone_numbers?fields=id,display_phone_number,verified_name,webhook_configuration&access_token=${TOKEN}" | python3 -m json.tool
          echo "--- WABA subscribed_apps ---"
          curl -sS "https://graph.facebook.com/v21.0/${WABA_ID}/subscribed_apps?access_token=${TOKEN}" | python3 -m json.tool
          echo "--- debug_token granular scopes ---"
          APP_ID=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_APP_ID'), ''))")
          APP_SECRET=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_APP_SECRET'), ''))")
          curl -sS "https://graph.facebook.com/v21.0/debug_token?input_token=${TOKEN}&access_token=${APP_ID}%7C${APP_SECRET}" | python3 -m json.tool

      - name: POST synthetic Meta webhook to production
        run: |
          HTTP=$(curl -s -o /tmp/webhook.json -w "%{http_code}" -X POST "${{ env.BACKEND_URL }}/api/webhooks/whatsapp/meta" \
            -H "Content-Type: application/json" \
            -d '{"object":"whatsapp_business_account","entry":[{"changes":[{"value":{"messages":[{"from":"919999999999","type":"text","text":{"body":"diag ping"}}]},"field":"messages"}]}]}')
          echo "Webhook POST HTTP: $HTTP"
          cat /tmp/webhook.json

      - name: Read webhook debug log
        run: |
          VERIFY=$(python3 -c "import json; d=json.load(open('/tmp/service.json')); print(next((e.get('value','') for e in d['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='WHATSAPP_META_WEBHOOK_VERIFY_TOKEN'), ''))")
          curl -sS "${{ env.BACKEND_URL }}/api/webhooks/whatsapp/meta/debug?verify_token=${VERIFY}&limit=10" | python3 -m json.tool
