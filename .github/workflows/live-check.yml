name: Live check (hourly, and after each deploy)

# Quality plan F8 (hourly) and F7 (after a backend deploy). Production is AWS.
# This checks https://api.brainbehindkavach.me and the ECS services. It does not call Cloud Run
# and it does not send traffic to the test project. Hourly: red only when the check itself
# could not run. After a deploy: red on any problem. It does not email. A problem is reported on OpenBot.
on:
  schedule:
    - cron: "17 * * * *" # every hour at :47 IST
  workflow_dispatch:
    inputs:
      trigger:
        description: "hourly | manual | deploy"
        default: "manual"
      force_test:
        description: "unused; kept so older dispatches still start"
        type: boolean
        default: false
  workflow_call:
    inputs:
      trigger:
        type: string
        default: "deploy"
      service:
        type: string
        default: ""

env:
  AWS_REGION: ap-south-1
  API: https://api.brainbehindkavach.me

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743887469650:role/gh-deploy-kavach-backend-api
          aws-region: ap-south-1
      - name: API and ECS
        env:
          TRIGGER: ${{ inputs.trigger || 'hourly' }}
          SERVICE_NAME: ${{ inputs.service }}
        run: |
          set -uo pipefail
          fail=0
          problem() { echo "::error::$1"; echo "$1"; fail=1; }
          ok() { echo "$1"; }

          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$API/api/health" || echo 000)
          if [ "$code" = 200 ] && python3 -c 'import json,sys; d=json.load(open("/tmp/health.json")); sys.exit(0 if d.get("status")=="ok" else 1)'; then
            ok "backend health ok"
          else
            problem "api.brainbehindkavach.me health HTTP $code"
          fi

          code=$(curl -sS -o /tmp/rem.json -w '%{http_code}' --max-time 20 "$API/api/health/reminders" || echo 000)
          age=$(python3 -c 'import json; print(json.load(open("/tmp/rem.json")).get("ageSeconds",""))' 2>/dev/null || true)
          if [ "$code" = 200 ] && [ -n "${age}" ] && [ "$age" -lt 180 ] 2>/dev/null; then
            ok "reminder tick ${age}s"
          else
            problem "reminder tick HTTP $code age ${age:-unknown}"
          fi

          wcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$API/api/webhooks/whatsapp/meta" -H 'content-type: application/json' -d '{}' || echo 000)
          case "$wcode" in
            401|403) ok "unsigned webhook $wcode" ;;
            *) problem "unsigned webhook $wcode (want 401 or 403)" ;;
          esac

          dcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://app.kavach.care/auth/login || echo 000)
          case "$dcode" in
            2*|3*) ok "dashboard $dcode" ;;
            *) problem "dashboard HTTP $dcode" ;;
          esac
          acode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://admin.brainbehindkavach.me/login || echo 000)
          case "$acode" in
            2*|3*) ok "admin $acode" ;;
            *) problem "admin HTTP $acode" ;;
          esac

          if ! aws ecs describe-services --cluster kavach --services backend engine admin admin-api dashboard cron --output json > /tmp/ecs.json; then
            problem "could not read ECS services"
          elif ! python3 -c 'import json; rows=json.load(open("/tmp/ecs.json")).get("services") or []; bad=[]; names={s.get("serviceName") for s in rows}; wants=("backend","engine","admin","admin-api","dashboard","cron"); bad.extend(w+" missing" for w in wants if w not in names); exec("for s in rows:\n r=s.get(\"runningCount\") or 0\n n=s.get(\"serviceName\")\n ok=s.get(\"status\")==\"ACTIVE\" and r>=1 and r==s.get(\"desiredCount\")\n (print(\"ecs %s %s/%s\"%(n,r,s.get(\"desiredCount\"))) if ok else bad.append(\"%s desired %s running %s %s\"%(n,s.get(\"desiredCount\"),r,s.get(\"status\"))))\nopen(\"/tmp/ecs.bad\",\"w\").write(\"\\n\".join(bad))")'; then
            problem "could not parse ECS output"
          elif [ -s /tmp/ecs.bad ]; then
            problem "ECS: $(paste -sd ';' /tmp/ecs.bad)"
          fi

          {
            echo "### Live check ($TRIGGER${SERVICE_NAME:+ $SERVICE_NAME})"
            echo
            echo "API $API. Problems: $fail"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" = 1 ] && [ "$TRIGGER" = "deploy" ]; then
            exit 1
          fi
          exit 0
