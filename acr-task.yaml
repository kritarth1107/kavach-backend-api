version: v1.1.0
steps:
  - build: -t {{.Run.Registry}}/kavach-backend:{{.Run.ID}} -t {{.Run.Registry}}/kavach-backend:{{.Run.Commit}} -t {{.Run.Registry}}/kavach-backend:latest --build-arg GIT_COMMIT_SHA={{.Run.Commit}} --build-arg GIT_BRANCH={{.Run.Branch}} --build-arg BUILD_TIME={{.Run.StartTime}} --build-arg IMAGE_TAG={{.Run.Commit}} .
  - push:
      - {{.Run.Registry}}/kavach-backend:{{.Run.ID}}
      - {{.Run.Registry}}/kavach-backend:{{.Run.Commit}}
      - {{.Run.Registry}}/kavach-backend:latest
  - cmd: az login --identity --output none
  - cmd: az containerapp update --name kavach-backend --resource-group kavach-prod-rg --image {{.Run.Registry}}/kavach-backend:{{.Run.ID}}
