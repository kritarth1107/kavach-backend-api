version: v1.1.0
steps:
  - build: -t {{.Run.Registry}}/kavach-backend:{{.Run.ID}} -t {{.Run.Registry}}/kavach-backend:latest .
  - push:
      - {{.Run.Registry}}/kavach-backend:{{.Run.ID}}
      - {{.Run.Registry}}/kavach-backend:latest
  - cmd: bash -c "az login --identity --output none && az containerapp update --name kavach-backend --resource-group kavach-prod-rg --image {{.Run.Registry}}/kavach-backend:{{.Run.ID}}"
    image: mcr.microsoft.com/azure-cli:cbl-mariner2.0
